    // ---------------------------------------------------------------------------
    // 相性計算エンジン（共鳴度・補完シナジー・総合スコア）
    // ---------------------------------------------------------------------------
    function calculateCompatibility(userStats, char, selectedKeywords) {
      let diffSum = 0;
      let synergySum = 0;

      for (let i = 0; i < 6; i++) {
        const u = userStats[i];
        const c = char.stats[i];
        diffSum += Math.abs(u - c);

        if ((u >= 7.5 && c >= 7.5) || (u < 6.5 && c >= 8) || (c < 6.5 && u >= 8)) {
          synergySum += (u + c) / 2;
        } else {
          synergySum += Math.min(u, c) * 0.85;
        }
      }

      const resonanceRaw = Math.max(0, 100 - (diffSum / 36) * 100);
      const resonance = Math.min(99, Math.round(55 + resonanceRaw * 0.44));
      const complement = Math.min(99, Math.round(50 + (synergySum / 60) * 49));

      let keywordBonus = 0;
      selectedKeywords.forEach((kwId) => {
        const kw = SOUL_KEYWORDS.find((k) => k.id === kwId);
        if (kw) {
          const axisIndex = AXES.findIndex((a) => a.key === kw.axis);
          if (axisIndex >= 0 && char.stats[axisIndex] >= 8) {
            keywordBonus += 1.5;
          }
        }
      });

      const total = Math.min(99, Math.round(resonance * 0.58 + complement * 0.42 + keywordBonus));

      const sharedStrengths = AXES.map((a, idx) => ({ ...a, score: userStats[idx] + char.stats[idx], diff: Math.abs(userStats[idx] - char.stats[idx]) }))
        .sort((a, b) => b.score - a.score);

      const admireAxis = AXES.map((a, idx) => ({ ...a, gap: char.stats[idx] - userStats[idx], charVal: char.stats[idx] }))
        .sort((a, b) => b.gap - a.gap)[0];

      return {
        total,
        resonance,
        complement,
        topSharedAxis: sharedStrengths[0],
        admireAxis: admireAxis.gap > 1 ? admireAxis : sharedStrengths[1],
      };
    }

    // ---------------------------------------------------------------------------
    // SVG 6軸レーダーチャート コンポーネント
    // ---------------------------------------------------------------------------
    function RadarChart({ userStats, oshiStats, bestStats, oshiName, bestName }) {
      const size = 300;
      const center = size / 2;
      const radius = 102;

      const getPoint = (index, value) => {
        const angle = (Math.PI * 2 * index) / 6 - Math.PI / 2;
        const r = (value / 10) * radius;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle),
        };
      };

      const makePolygon = (stats) =>
        stats.map((val, i) => {
          const pt = getPoint(i, val);
          return `${pt.x},${pt.y}`;
        }).join(' ');

      return (
        <div className="flex flex-col items-center">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="max-w-full overflow-visible">
            {[2, 4, 6, 8, 10].map((level) => (
              <polygon
                key={level}
                points={[0, 1, 2, 3, 4, 5].map((i) => {
                  const pt = getPoint(i, level);
                  return `${pt.x},${pt.y}`;
                }).join(' ')}
                fill={level === 10 ? 'rgba(253, 242, 248, 0.5)' : 'none'}
                stroke="#e2e8f0"
                strokeWidth="1"
              />
            ))}

            {[0, 1, 2, 3, 4, 5].map((i) => {
              const pt = getPoint(i, 10);
              return <line key={i} x1={center} y1={center} x2={pt.x} y2={pt.y} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="3 3" />;
            })}

            {bestStats && (
              <polygon
                points={makePolygon(bestStats)}
                fill="rgba(56, 189, 248, 0.16)"
                stroke="#0284c7"
                strokeWidth="2"
                strokeDasharray="4 2"
              />
            )}

            {oshiStats && (
              <polygon
                points={makePolygon(oshiStats)}
                fill="rgba(168, 85, 247, 0.18)"
                stroke="#9333ea"
                strokeWidth="2"
              />
            )}

            <polygon
              points={makePolygon(userStats)}
              fill="rgba(236, 72, 153, 0.30)"
              stroke="#db2777"
              strokeWidth="3"
            />

            {userStats.map((val, i) => {
              const pt = getPoint(i, val);
              return <circle key={i} cx={pt.x} cy={pt.y} r="4.5" fill="#db2777" stroke="#fff" strokeWidth="1.5" />;
            })}

            {AXES.map((axis, i) => {
              const angle = (Math.PI * 2 * i) / 6 - Math.PI / 2;
              const labelRadius = radius + 28;
              const lx = center + labelRadius * Math.cos(angle);
              const ly = center + labelRadius * Math.sin(angle);
              return (
                <g key={axis.key}>
                  <text
                    x={lx}
                    y={ly - 4}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    className="text-[11px] font-bold fill-slate-700"
                  >
                    {axis.short}
                  </text>
                  <text
                    x={lx}
                    y={ly + 10}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    className="text-[10px] font-semibold fill-pink-600"
                  >
                    {userStats[i].toFixed(1)}
                  </text>
                </g>
              );
            })}
          </svg>

          <div className="flex flex-wrap justify-center gap-4 mt-2 text-xs font-medium text-slate-600">
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-full bg-pink-600 inline-block"></span>
              <span>あなた</span>
            </div>
            {oshiStats && (
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-full bg-purple-600 inline-block"></span>
                <span>推し（{oshiName}）</span>
              </div>
            )}
            {bestStats && (
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-full bg-sky-600 inline-block"></span>
                <span>最高相性（{bestName}）</span>
              </div>
            )}
          </div>
        </div>
      );
    }

                      className="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 via-purple-600 to-sky-500 text-white font-extrabold text-base shadow-lg hover:shadow-xl hover:scale-[1.02] transition flex items-center gap-2"
                    >
                      ✦ 深層分析結果を見る！
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ===============================================================
                STEP 4: 診断結果＆6軸レーダーチャート＆深層レポート
            =============================================================== */}
            {step === 4 && (
              <div className="space-y-6 animate-fade-in">
                {/* 1. あなたの6軸パーソナリティ分析＆レーダーチャート */}
                <div className="bg-white/95 rounded-3xl p-6 sm:p-8 shadow-md border border-pink-100">
                  <div className="text-center max-w-2xl mx-auto mb-6">
                    <span className="inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full bg-pink-100 text-pink-700 mb-2">
                      ✦ あなたの深層パーソナリティ分析 ✦
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold bg-gradient-to-r from-pink-600 via-purple-600 to-sky-600 bg-clip-text text-transparent">
                      {archetype.title}
                    </h2>
                    <p className="text-sm text-slate-600 mt-2 leading-relaxed">{archetype.desc}</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    <div className="bg-slate-50/70 rounded-2xl p-4 border border-slate-100">
                      <RadarChart
                        userStats={userStats}
                        oshiStats={oshiMatch ? oshiMatch.char.stats : null}
                        bestStats={bestMatch.char.stats}
                        oshiName={oshiMatch ? oshiMatch.char.name : ''}
                        bestName={bestMatch.char.name}
                      />
                    </div>

                    <div className="space-y-3">
                      {AXES.map((axis, idx) => {
                        const val = userStats[idx];
                        return (
                          <div key={axis.key} className="bg-slate-50/80 p-3 rounded-xl border border-slate-100">
                            <div className="flex justify-between items-center text-xs font-bold mb-1">
                              <span className="text-slate-700">{axis.label}</span>
                              <span className="text-pink-600 text-sm">{val.toFixed(1)} / 10</span>
                            </div>
                            <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                              <div
                                className="h-full bg-gradient-to-r from-pink-500 to-purple-500 rounded-full"
                                style={{ width: `${(val / 10) * 100}%` }}
                              />
                            </div>
                            <p className="text-[11px] text-slate-500 mt-1">{axis.desc}</p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* 2. 選んだ推しとの相性 & 最高相性プリキュア */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {oshiMatch && (
                    <div className="bg-white/95 rounded-3xl p-6 shadow-md border-2 border-purple-200 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <span className="text-xs font-extrabold px-3 py-1 rounded-full bg-purple-100 text-purple-700 flex items-center gap-1">
                            ♥ あなたが選んだ推しとの相性
                          </span>
                          <span className="text-xs font-bold text-slate-400">{oshiMatch.char.series}</span>
                        </div>

                        <div className="flex items-center justify-between gap-4 my-3">
                          <div>
                            <h3 className="text-2xl font-extrabold text-slate-800">{oshiMatch.char.name}</h3>
                            <p className="text-sm font-medium text-slate-500">{oshiMatch.char.civilian}</p>
                          </div>
                          <div className="text-right">
                            <div className="text-xs font-bold text-purple-600">総合相性</div>
                            <div className="text-4xl font-black text-purple-600">{oshiMatch.compat.total}%</div>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2.5 my-4">
                          <div className="bg-purple-50/70 p-3 rounded-2xl border border-purple-100">
                            <div className="text-[11px] font-bold text-purple-700">共鳴度（似ているところ）</div>
                            <div className="text-xl font-extrabold text-purple-900 mt-0.5">{oshiMatch.compat.resonance}%</div>
                            <div className="text-[11px] text-slate-600 mt-0.5">
                              共鳴軸: <b>{oshiMatch.compat.topSharedAxis.short}</b>
                            </div>
                          </div>
                          <div className="bg-pink-50/70 p-3 rounded-2xl border border-pink-100">
                            <div className="text-[11px] font-bold text-pink-700">憧れ・補完シナジー</div>
                            <div className="text-xl font-extrabold text-pink-900 mt-0.5">{oshiMatch.compat.complement}%</div>
                            <div className="text-[11px] text-slate-600 mt-0.5">
                              推しの輝き: <b>{oshiMatch.compat.admireAxis.short}</b>
                            </div>
                          </div>
                        </div>

                        <p className="text-xs text-slate-600 bg-slate-50 p-3.5 rounded-2xl leading-relaxed border border-slate-100">
                          <b className="text-slate-800">【相性分析】</b> {oshiMatch.char.bio}
                          あなたとは特に「{oshiMatch.compat.topSharedAxis.label}」の波長が近く、さらに彼女の持つ「{oshiMatch.compat.admireAxis.label}」があなたの背中を力強く押してくれる最高の関係です。
                        </p>
                      </div>

                      <div className="mt-4 pt-3 border-t border-slate-100 text-xs italic text-slate-500">
                        「{oshiMatch.char.quote}」
                      </div>
                    </div>
                  )}

                  {/* 全プリキュア中の最高相性 (1位) */}
                  <div
                    className={`bg-white/95 rounded-3xl p-6 shadow-md border-2 border-sky-200 flex flex-col justify-between ${
                      !oshiMatch ? 'md:col-span-2' : ''
                    }`}
                  >
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-extrabold px-3 py-1 rounded-full bg-sky-100 text-sky-700 flex items-center gap-1">
                          👑 あなたと一番相性のいいプリキュア（全{PRECURE_LIST.length}人中 1位）
                        </span>
                        <span className="text-xs font-bold text-slate-400">{bestMatch.char.series}</span>
                      </div>

                      <div className="flex items-center justify-between gap-4 my-3">
                        <div>
                          <h3 className="text-2xl font-extrabold text-slate-800">{bestMatch.char.name}</h3>
                          <p className="text-sm font-medium text-slate-500">{bestMatch.char.civilian}</p>
                        </div>
                        <div className="text-right">
                          <div className="text-xs font-bold text-sky-600">最高マッチ度</div>
                          <div className="text-4xl font-black text-sky-600">{bestMatch.compat.total}%</div>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5 my-4">
                        <div className="bg-sky-50/70 p-3 rounded-2xl border border-sky-100">
                          <div className="text-[11px] font-bold text-sky-700">魂の共鳴度</div>
                          <div className="text-xl font-extrabold text-sky-900 mt-0.5">{bestMatch.compat.resonance}%</div>
                          <div className="text-[11px] text-slate-600 mt-0.5">
                            共鳴軸: <b>{bestMatch.compat.topSharedAxis.short}</b>
                          </div>
                        </div>
                        <div className="bg-amber-50/70 p-3 rounded-2xl border border-amber-100">
                          <div className="text-[11px] font-bold text-amber-700">補完シナジー</div>
                          <div className="text-xl font-extrabold text-amber-900 mt-0.5">{bestMatch.compat.complement}%</div>
                          <div className="text-[11px] text-slate-600 mt-0.5">
                            相乗効果: <b>{bestMatch.compat.admireAxis.short}</b>
                          </div>
                        </div>
                      </div>

                      <p className="text-xs text-slate-600 bg-slate-50 p-3.5 rounded-2xl leading-relaxed border border-slate-100">
                        <b className="text-slate-800">【1位選出の理由】</b> {bestMatch.char.bio}
                        あなたの6軸波形と最も美しく重なり合い、自然体のままでお互いの強みを最大限に引き出せる運命のパートナーです！
                      </p>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                      <span className="italic">「{bestMatch.char.quote}」</span>
                      {oshiMatch && oshiMatch.char.id !== bestMatch.char.id && (
                        <button
                          onClick={() => {
                            setSelectedOshiId(bestMatch.char.id);
                          }}
                          className="text-sky-600 font-bold hover:underline shrink-0 ml-2"
                        >
                          この子を推しに設定する
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* 3. 次点ランキング（2位・3位） */}
                <div className="bg-white/90 rounded-3xl p-6 shadow-sm border border-pink-100">
                  <h3 className="text-sm font-extrabold text-slate-700 mb-3 flex items-center gap-1.5">
                    ★ あなたと波長が合うプリキュア 次点ランキング（2位・3位）
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {[
                      { rank: 2, data: secondMatch },
                      { rank: 3, data: thirdMatch },
                    ].map(({ rank, data }) => (
                      <div key={data.char.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200/70 flex items-center justify-between">
                        <div>
                          <div className="text-xs font-bold text-pink-600">
                            第{rank}位 ・ {data.char.series}
                          </div>
                          <div className="text-base font-extrabold text-slate-800">
                            {data.char.name} <span className="text-xs font-normal text-slate-500">（{data.char.civilian}）</span>
                          </div>
                          <div className="text-[11px] text-slate-500 mt-0.5">
                            共鳴軸: {data.compat.topSharedAxis.label}（共鳴 {data.compat.resonance}%）
                          </div>
                        </div>
                        <div className="text-2xl font-black text-slate-700">{data.compat.total}%</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 4. パーソナル深層診断レター（自動生成済み） */}
                <div className="bg-gradient-to-br from-pink-50 via-purple-50 to-sky-50 rounded-3xl p-6 sm:p-8 shadow-md border border-pink-200">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                    <div>
                      <span className="inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full bg-white text-pink-600 shadow-sm mb-2">
                        ✦ Deep Resonance Letter
                      </span>
                      <h3 className="text-xl font-extrabold text-slate-800">
                        あなただけの深層相性＆パーソナル診断レター
                      </h3>
                      <p className="text-xs text-slate-600 mt-0.5">
                        6軸スコアと選んだキーワードから導き出された、あなたとプリキュアの絆の物語です。
                      </p>
                    </div>
                    <button
                      onClick={handleGenerateReport}
                      className="px-4 py-2 rounded-xl bg-white hover:bg-pink-50 text-pink-600 border border-pink-200 font-bold text-xs shadow-sm transition shrink-0"
                    >
                      ↻ レターを再生成・更新
                    </button>
                  </div>

                  <div className="bg-white/95 rounded-2xl p-5 sm:p-6 border border-pink-100 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap shadow-inner">
                    {deepReport || generateLocalDeepLetter(userStats, archetype, oshiMatch, bestMatch, selectedKeywords)}
                  </div>
                </div>

                {/* 5. SNSシェア＆結果カード画像保存・もう一度占う */}
                <div className="bg-white/90 rounded-3xl p-6 shadow-sm border border-pink-100 flex flex-col items-center text-center">
                  <h3 className="text-base font-extrabold text-slate-800 mb-1">
                    診断結果をSNSでシェア・画像保存する
                  </h3>
                  <p className="text-xs text-slate-500 mb-4">
                    X（旧Twitter）へのワンタップ投稿や、6軸スコア入りの特製画像カードを保存できます。
                  </p>

                  <div className="flex flex-wrap justify-center gap-3">
                    <button
                      onClick={handleShareX}
                      className="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm flex items-center gap-2 transition shadow-sm"
                    >
                      𝕏 診断結果をポストする
                    </button>

                    <button
                      onClick={generateShareCard}
                      className="px-5 py-2.5 rounded-xl bg-pink-600 hover:bg-pink-700 text-white font-bold text-sm flex items-center gap-2 transition shadow-sm"
                    >
                      🖼 結果カード画像を生成する
                    </button>

                    <button
                      onClick={() => {
                        setAnswers({});
                        setSelectedKeywords([]);
                        setCurrentQIndex(0);
                        setDeepReport('');
                        setCardImageUrl(null);
                        setStep(1);
                      }}
                      className="px-5 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-sm flex items-center gap-2 transition"
                    >
                      ↺ 最初からもう一度占う
                    </button>
                  </div>

                  <canvas ref={canvasRef} className="hidden" />

                  {cardImageUrl && (
                    <div className="mt-6 flex flex-col items-center">
                      <img
                        src={cardImageUrl}
                        alt="診断結果カード"
                        className="max-w-xs sm:max-w-sm rounded-2xl shadow-lg border border-pink-200"
                      />
                      <a
                        href={cardImageUrl}
                        download="precure-deep-fortune-card.png"
                        className="mt-3 px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow"
                      >
                        画像を端末に保存（ダウンロード）
                      </a>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
